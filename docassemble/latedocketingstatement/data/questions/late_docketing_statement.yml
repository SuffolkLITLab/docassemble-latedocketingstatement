  - next_steps: ALDocument.using(title="Filing instructions", filename="late_appeal_instructions", enabled=True, has_addendum=False)
  - exhibits_attachment: ALDocument.using(title="Supporting documents", filename="supporting_documents", has_addendum=False)
  - al_user_bundle: ALDocumentBundle.using(elements=[next_steps, late_docketing_statement_attachment, exhibits_attachment], filename="late_appeal_package", title="Your motion and instructions", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[late_docketing_statement_attachment, exhibits_attachment], filename="late_appeal_court_documents", title="Motion and supporting documents", enabled=True)
---
code: |
  exhibits_attachment.enabled = has_documents
---
code: |
  exhibits_attachment[i] = pdf_concatenate(supporting_documents)
---
