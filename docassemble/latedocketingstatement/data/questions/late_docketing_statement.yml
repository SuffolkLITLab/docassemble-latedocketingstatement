  can_I_use_this_form: |
    Use this interview if you represent yourself in a Massachusetts civil case,
    already filed a notice of appeal, and received a notice of assembly of the record.
    It asks for permission to enter the appeal late in the Appeals Court.
    It does not ask to file a late notice of appeal or a late Civil Docketing Statement.
    It does not handle criminal appeals or an appeal that the trial court has dismissed.
  before_you_start: |
    Gather your notice of assembly, the case name and number, and contact details
