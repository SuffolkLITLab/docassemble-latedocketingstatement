id: late entry introduction
question: |
  Ask to enter your appeal late
subquestion: |
  Entering an appeal means registering it with the Appeals Court. In a civil
  case, the usual deadline is **14 days after you receive the notice of assembly**.

  This interview asks one Appeals Court judge, called a **single justice**,
  to let you enter your appeal late. The judge decides whether to allow it.

  This is different from:

  * A **notice of appeal**, which you file in the trial court to start an appeal.
  * A **Civil Docketing Statement**, which gives the Appeals Court details about
    a case that has already been entered.

  If you need a different motion, read the
  [Appeals Court guide](https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals)
  or call the clerk at **617-725-8106**. Filing this motion does not stop other deadlines.
continue button field: late_entry_intro
---
id: scope questions
question: |
  Is this the right motion for you?
fields:
  - Are you representing yourself in a civil case?: civil_self_represented
    datatype: yesnoradio
  - Have you already filed a notice of appeal in the trial court?: notice_filed
    datatype: yesnoradio
  - Have you received a notice of assembly of the record?: assembly_received
    datatype: yesnoradio
---
event: wrong_motion
id: wrong motion
question: |
  You may need a different step
subquestion: |
  This interview is for people representing themselves in a **civil case**.
  You must have filed a notice of appeal and received a notice of assembly.

  Read the [Appeals Court guide](https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals)
  or call the Appeals Court clerk at **617-725-8106** to find the right procedure.
  Act promptly. There may be a deadline.
  [Find legal help through MassLegalHelp](https://www.masslegalhelp.org/find-lawyer).

  ${ action_button_html(url_action("civil_self_represented"), label="Change my answers", color="info") }
buttons:
  - Exit: exit
    url: https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals
---
id: dismissal status
question: |
  Has the trial court dismissed your appeal?
subquestion: |
  Look for a court order dismissing the appeal. A request from the other side
  to dismiss it is not itself a court order.
fields:
  - The trial court has dismissed my appeal: appeal_dismissed
    datatype: yesnoradio
  - Is a motion to dismiss your appeal waiting for a trial court decision?: dismissal_motion_pending
    datatype: yesnoradio
    show if:
      variable: appeal_dismissed
      is: False
---
event: dismissed_appeal
id: dismissed appeal
question: |
  Get help with the dismissal order
subquestion: |
  This interview does not challenge an order that already dismissed your appeal.
  A motion to enter an appeal late may not undo that order.

  Call the Appeals Court clerk at **617-725-8106** and seek legal help promptly.
  Ask what steps and deadlines apply to the dismissal order.
  [Find legal help through MassLegalHelp](https://www.masslegalhelp.org/find-lawyer).

  ${ action_button_html(url_action("appeal_dismissed"), label="Change my answer", color="info") }
buttons:
  - Exit: exit
    url: https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals
---
id: pending dismissal warning
question: |
  Check the pending motion to dismiss
subquestion: |
  A motion to dismiss is still before the trial court. A single justice
  ordinarily will not decide a motion to enter the appeal late while that
  motion is pending. Call the Appeals Court clerk at **617-725-8106** about
  the order of steps. Meet any trial court deadline to respond.

  You can keep preparing this motion. This interview does not prepare your
  response to the motion to dismiss.
continue button field: pending_dismissal_warning
---
id: contact information
question: |
  How can the court contact you?
fields:
  - Phone number: contact_phone
    required: False
  - Email address: contact_email
    datatype: email
    required: False
---
id: case caption
question: |
  What is the name of your case?
subquestion: |
  Copy the full case name from your trial court papers. Include all parties,
  just as they appear there. For example: Taylor Green v. Morgan Rivera.
fields:
  - Case name: case_caption
    input type: area
---
id: trial court details
question: |
  Which trial court handled your case?
fields:
  - Trial court name and location: trial_court_name
    hint: For example, Suffolk Superior Court
  - Trial court case number: trial_docket_number
---
id: appeals number available
question: |
  Has the Appeals Court given this matter a case number?
subquestion: |
  This may be a single justice case number. Use the Appeals Court number only
  if you have one. The trial court number is different.
fields:
  - no label: has_appeals_number
    datatype: yesnoradio
---
id: appeals number
question: |
  What is the Appeals Court case number?
fields:
  - Appeals Court case number: appeals_docket_number
---
id: notice received
question: |
  When did you receive the notice of assembly?
subquestion: |
  Enter the day you received it, not the day printed on the notice.
fields:
  - Date received: notice_date
    datatype: date
    max: ${ today() }
---
id: reasons for delay
question: |
  Why did you miss the deadline?
subquestion: |
  Explain what kept you from entering your appeal on time. Include important
  dates and what you did when you learned you missed the deadline.

  The judge will decide whether your reasons amount to **excusable neglect**.
  That means a reason the court accepts for missing the deadline. Missing the
  deadline does not automatically mean you will get more time.
fields:
  - What happened?: excuse_description
    input type: area
---
id: issues on appeal
question: |
  What errors do you want the Appeals Court to review?
subquestion: |
  Describe the trial court decision you want changed and the specific errors
  you believe the court made. Explain why they matter to the result.

  The judge must decide whether you have a **meritorious issue**: a real legal
  question worth reviewing. You do not have to prove that you will win now.
fields:
  - Errors you want reviewed: issue_description
    input type: area
---
id: other side position
question: |
  Do you know the other side's position on this motion?
fields:
  - no label: opposition_status
    choices:
      - All other parties agree: All other parties assent to this motion.
      - No other party opposes it: No other party opposes this motion.
      - At least one party plans to oppose it: At least one party plans to oppose this motion.
      - I do not know: I do not know the other parties' positions on this motion.
---
id: service recipients
question: |
  Who needs a copy of your papers?
subquestion: |
  List **each other party's lawyer**. If a party has no lawyer, list that party.
  Include each person's name, mailing address, and email address if you know it.
  You can list more than one person below.

  Do not send an affidavit of indigency or other private fee-waiver papers
  to the other parties.
fields:
  - Names and addresses: service_recipients
    input type: area
---
id: service completed
question: |
  Have you already sent copies to everyone listed?
subquestion: |
  If you have not sent them yet, your certificate will have blank spaces for
  the service date and method. Fill them in and sign the certificate
  **after** you send the copies. Do not certify a planned delivery as completed.
fields:
  - no label: service_done
    datatype: yesnoradio
---
id: service details
question: |
  Tell us about the copies you sent
subquestion: |
  For email or electronic service, use a method allowed by the court's rules.
  Ordinary email generally requires the recipient's consent.
  If you used different methods or dates, describe each recipient separately.
fields:
  - Last date copies were sent: service_date
    datatype: date
    max: ${ today() }
  - Dates and delivery methods for each recipient: service_method
    input type: area
    hint: For example, first-class mail to both recipients on the date above.
---
id: supporting documents choice
question: |
  Do you want to attach supporting documents?
subquestion: |
  You can attach your notice of assembly and documents that support your
  explanation. Include only papers needed for this request. Keep fee-waiver
  papers separate because they contain private financial information.
fields:
  - no label: has_documents
    datatype: yesnoradio
---
id: supporting documents upload
question: |
  Upload your supporting documents
subquestion: |
  Choose all the files you want to attach. Check the preview to make sure they
  are readable and in the right order.
fields:
  - Supporting documents: supporting_documents
    datatype: files
    accept: |
      "application/pdf,image/*"
---
id: filing information
question: |
  What you will do with your papers
subquestion: |
  This interview does **not** file your motion. You will need to:

  1. Review and sign the motion and affidavit. The affidavit is your statement
     of facts signed under the penalties of perjury.
  2. Send copies to the other parties or their lawyers. Then complete and sign
     the certificate of service.
  3. File with the **Appeals Court single justice** and send a courtesy copy
     to the trial court. Call **617-725-8106** about filing methods if needed.
  4. Pay the **$315 civil filing fee**, or submit a motion to waive the fee
     with an affidavit of indigency. Additional fees may apply when you enter
     the appeal after permission is granted.

  Need a fee waiver? Use the separate
  [Affidavit of Indigency interview](https://apps.suffolklitlab.org/start/indigency/).
  You also need to ask the Appeals Court to waive its entry fee. This interview
  does not make that separate motion. Keep financial papers out of the copies
  you send to the other side.
  [MassLegalHelp explains how to fill out the affidavit](https://www.masslegalhelp.org/courts-hearings-language-rights/courts-massachusetts/how-fill-out-affidavit-indigency).

  Check the [court's current instructions](https://www.mass.gov/info-details/single-justice-practice)
  before filing. A judge must grant your request before you can rely on it.
continue button field: filing_information
---
id: preview late docketing motion
question: |
  Review your motion and affidavit
subquestion: |
  ${ al_court_bundle.as_pdf(key="final") }

  Check the case details, your reasons, and your service information.
  Your documents have blank signature lines for you to sign after printing.

  ${ action_button_html(url_action("review_late_docketing_statement"), label="Make changes", color="info") }
continue button field: late_docketing_statement_preview
---
event: review_late_docketing_statement
id: review late docketing answers
question: |
  Review your answers
review:
  - Edit: users[0].name.first
    button: |
      **Your name:** ${ users[0] }
  - Edit: users[0].address.address
    button: |
      **Your address:** ${ users[0].address.on_one_line() }
  - Edit: contact_phone
    button: |
      **Contact:** ${ contact_phone }; ${ contact_email }
  - Edit: case_caption
    button: |
      **Case name:** ${ case_caption }
  - Edit: trial_court_name
    button: |
      **Trial court:** ${ trial_court_name }; ${ trial_docket_number }
  - Edit: has_appeals_number
    button: |
      **Appeals Court number:** ${ appeals_docket_number if has_appeals_number else "Not assigned" }
  - Edit: notice_date
    button: |
      **Notice received:** ${ notice_date }
  - Edit: excuse_description
    button: |
      **Why you missed the deadline:** ${ excuse_description }
  - Edit: issue_description
    button: |
      **Errors to review:** ${ issue_description }
  - Edit: opposition_status
    button: |
      **Other parties' position:** ${ opposition_status }
  - Edit: appeal_dismissed
    button: |
      **Appeal dismissed by the trial court:** ${ word(yesno(appeal_dismissed)) }
      % if not appeal_dismissed:
      **Pending motion to dismiss:** ${ word(yesno(dismissal_motion_pending)) }
      % endif
  - Edit: service_recipients
    button: |
      **People receiving copies:** ${ service_recipients }
  - Edit: service_done
    button: |
      **Copies already sent:** ${ word(yesno(service_done)) }
  - Edit: service_date
    show if: service_done
    button: |
      **Service:** ${ service_date }; ${ service_method }
  - Edit: has_documents
    button: |
      **Supporting documents:** ${ word(yesno(has_documents)) }
  - Edit: supporting_documents
    show if: has_documents
    button: |
      **Files:** ${ supporting_documents }
---
event: late_docketing_statement_download
id: download late docketing motion
question: |
  Your motion is ready to download
subquestion: |
  **You have not filed anything yet.** Print and sign your papers. Follow the
  instructions included with your download. Keep a copy of everything.

  ${ al_user_bundle.download_list_html(include_full_pdf=True) }

  ${ action_button_html(url_action("review_late_docketing_statement"), label="Make changes", color="info") }
progress: 100
