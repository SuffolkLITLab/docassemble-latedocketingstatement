metadata:
  title: Ask to enter a Massachusetts civil appeal late
  short title: Enter an appeal late
  description: |
    Missed the deadline to enter your civil appeal? Ask the Appeals Court for more
    time. Make a motion and an affidavit. A motion is a written court request.
    An affidavit is a statement of facts you sign as true. This is for Massachusetts.
  authors:
    - Suffolk LIT Lab
  jurisdiction: NAM-US-US+MA
  LIST_topics:
