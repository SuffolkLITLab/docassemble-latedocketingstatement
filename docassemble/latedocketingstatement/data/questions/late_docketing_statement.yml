    - Massachusetts Appeals Court
  typical_role: appellant
  form_numbers: []
  requires_notarization: False
  efiling_enabled: False
  integrated_efiling: False
  integrated_email_filing: False
  update_notes: |
    Adds a supporting affidavit, a service certificate, and filing steps
    for a late civil appeal-entry motion.
  review_date: 2026-11-22
  estimated_completion_minutes: 20
  estimated_completion_delta: 10
  fees:
    - Filing fee: 315
  can_I_use_this_form: |
    Use this form if you have no lawyer in a Massachusetts civil case.
    You must have filed a notice of appeal. You must also have a notice of assembly.
    A notice of appeal tells the trial court you want a higher court to review
    its decision. A notice of assembly says your court record is ready.
    This form asks to add your appeal to the Appeals Court case list after the deadline.
    It does not ask to file a late notice of appeal or a late Civil Docketing Statement.
    It does not handle criminal appeals or an appeal that the trial court has dismissed.
  before_you_start: |
    Gather your notice of assembly, the case name and number, and contact details
    for the other parties or their lawyers. Be ready to explain why you missed
    the deadline and what errors you want the Appeals Court to review.
    You will print and sign your papers. This interview does not file them.
    It does not make a motion to waive the fee (ask the court not to charge you).
  when_you_are_finished: |
    Check and sign your papers. Send copies to the other people in the case or
    their lawyers. Fill in the certificate of service, which says who got copies
    and how. File with the Appeals Court single justice (one judge). Send a copy
    to the trial court too. Pay the fee or ask to waive it. To ask, file a motion
    and an affidavit of indigency, which tells the court about your money. Keep copies.
