id: late entry introduction
question: |
  Ask to enter your appeal late
subquestion: |
  Entering an appeal means adding it to the Appeals Court case list. In a civil
  case, the usual deadline is **14 days after you get the notice of assembly**.
  That notice says the trial court record is ready. A civil case is not a criminal case.

  A **motion** is a written request to a court. This motion asks one Appeals Court judge, called a **single justice**,
  to let you enter your appeal late. The judge decides whether to allow it.

  This is different from:

  * A **notice of appeal**, which you file in the trial court to start an appeal.
  * A **Civil Docketing Statement**, which gives the Appeals Court details about
    a case that has already been entered.

  If you need a different motion, read the
  [Appeals Court guide](https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals)
  or call the clerk at **617-725-8106**. Filing this motion does not stop other deadlines.
continue button field: late_entry_intro
---
id: scope questions
question: |
  Is this the right motion for you?
fields:
  - Do you have a civil case and no lawyer?: civil_self_represented
    datatype: yesnoradio
  - Have you already filed a notice of appeal in the trial court?: notice_filed
    datatype: yesnoradio
  - Have you gotten a notice of assembly of the record?: assembly_received
    datatype: yesnoradio
---
event: wrong_motion
id: wrong motion
question: |
  You may need a different step
subquestion: |
  This interview is for people who have no lawyer in a **civil case**.
  You must have filed a notice of appeal and gotten a notice of assembly.

  Read the [Appeals Court guide](https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals)
  or call the Appeals Court clerk at **617-725-8106** to find the right steps.
  Act soon. There may be a deadline.
  [Find legal help through MassLegalHelp](https://www.masslegalhelp.org/find-lawyer).

  ${ action_button_html(url_action("civil_self_represented"), label="Change my answers", color="info") }
buttons:
  - Exit: exit
    url: https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals
---
id: dismissal status
question: |
  Has the trial court dismissed your appeal?
subquestion: |
  To **dismiss** an appeal means to end it. Look for an order from the court
  that ends your appeal. The other side may have asked the court to end it.
  That does not mean the court has done so.
fields:
  - The trial court has dismissed my appeal: appeal_dismissed
    datatype: yesnoradio
  - Is a motion to dismiss your appeal waiting for a trial court decision?: dismissal_motion_pending
    datatype: yesnoradio
    show if:
      variable: appeal_dismissed
      is: False
---
event: dismissed_appeal
id: dismissed appeal
question: |
  Get help with the dismissal order
subquestion: |
  This interview does not challenge an order that already dismissed your appeal.
  A motion to enter an appeal late may not undo that order.

  Call the Appeals Court clerk at **617-725-8106** and get legal help soon.
  Ask what steps and deadlines apply to the dismissal order.
  [Find legal help through MassLegalHelp](https://www.masslegalhelp.org/find-lawyer).

  ${ action_button_html(url_action("appeal_dismissed"), label="Change my answer", color="info") }
buttons:
  - Exit: exit
    url: https://www.mass.gov/info-details/guide-to-civil-and-criminal-panel-appeals
---
id: pending dismissal warning
question: |
  Check the motion to dismiss that is waiting for a ruling
subquestion: |
  The trial court has not yet ruled on the motion to dismiss (end) your appeal.
  The single justice usually waits for the trial court to rule on that motion.
  Then the single justice can rule on your motion to enter the appeal late. Call the Appeals Court clerk at **617-725-8106** about
  the order of steps. Meet any trial court deadline to respond.

  You can keep working on this motion. This interview does not write your
  response to the motion to dismiss.
continue button field: pending_dismissal_warning
---
id: contact information
question: |
  How can the court contact you?
fields:
  - Phone number: contact_phone
    required: False
  - Email address: contact_email
    datatype: email
    required: False
---
id: case caption
question: |
  What is the name of your case?
subquestion: |
  Copy the full case name from your trial court papers. Include all people or groups in the case,
  just as they are listed there. For example: Taylor Green v. Morgan Rivera.
fields:
  - Case name: case_caption
    input type: area
---
id: trial court details
question: |
  Which trial court handled your case?
fields:
  - Trial court name and location: trial_court_name
    hint: For example, Suffolk Superior Court
  - Trial court case number: trial_docket_number
---
id: appeals number available
question: |
  Has the Appeals Court given this case a number?
subquestion: |
  This may be a single justice case number. Use the Appeals Court number only
  if you have one. The trial court number is different.
fields:
  - no label: has_appeals_number
    datatype: yesnoradio
---
id: appeals number
question: |
  What is the Appeals Court case number?
fields:
  - Appeals Court case number: appeals_docket_number
---
id: notice received
question: |
  When did you get the notice of assembly?
subquestion: |
  Enter the day you got it, not the day printed on the notice.
fields:
  - Date received: notice_date
    datatype: date
    max: ${ today() }
---
id: reasons for delay
question: |
  Why did you miss the deadline?
subquestion: |
  Explain what kept you from entering your appeal on time. Include important
  dates and what you did when you learned you missed the deadline.

  The judge will check whether your reasons meet the legal test for **excusable neglect**.
  That means a reason the court accepts for missing the deadline. Missing the
  deadline does not mean you will get more time.
fields:
  - What happened?: excuse_description
    input type: area
---
id: issues on appeal
question: |
  What errors do you want the Appeals Court to review?
subquestion: |
  Tell us which trial court decision you want changed. List the errors
  you think the court made. Explain why they matter to the result.

  The judge must find a **meritorious issue**: a real legal question worth
  looking at. You do not have to prove that you will win now.
fields:
  - Errors you want reviewed: issue_description
    input type: area
---
id: other side position
question: |
  Does the other side agree with this motion?
fields:
  - no label: opposition_status
    choices:
      - All other parties agree: All other parties assent to this motion.
      - No other party opposes it: No other party opposes this motion.
      - At least one party plans to oppose it: At least one party plans to oppose this motion.
      - I do not know: I do not know the other parties' positions on this motion.
---
id: service recipients
question: |
  Who needs a copy of your papers?
subquestion: |
  List **each other party's lawyer**. If a party has no lawyer, list that party.
  Include each person's name, mailing address, and email address if you know it.
  You can list more than one person below.

  Do not send the other parties papers about waiving fees. Those papers have
  private facts about your money.
fields:
  - Names and addresses: service_recipients
    input type: area
---
id: service completed
question: |
  Have you already sent copies to everyone listed?
subquestion: |
  Your **certificate of service** says who got copies and how you sent them.
  If you have not sent copies yet, it will have blank spaces for the date and
  how you sent them. Fill in the blanks and sign **after** you send the copies.
  Do not sign to say you sent copies if you have not sent them yet.
fields:
  - no label: service_done
    datatype: yesnoradio
---
id: service details
question: |
  Tell us about the copies you sent
subquestion: |
  Sending copies is called **service**. Follow the court rules for how to send
  them. To use regular email, you usually need the other person to agree.
  If you sent copies in different ways or on different dates, list each person.
fields:
  - Last date copies were sent: service_date
    datatype: date
    max: ${ today() }
  - Dates and how you sent copies to each person: service_method
    input type: area
    hint: For example, first-class mail to both people on the date above.
---
id: supporting documents choice
question: |
  Do you want to attach supporting documents?
subquestion: |
  You can add your notice of assembly and other papers to show what happened. Use only papers needed to explain why you should get more time. Keep papers
  about waiving fees separate. They have private facts about your money.
fields:
  - no label: has_documents
    datatype: yesnoradio
---
id: supporting documents upload
question: |
  Upload your supporting documents
subquestion: |
  Choose all the files you want to attach. Check the preview to make sure they
  are readable and in the right order.
fields:
  - Supporting documents: supporting_documents
    datatype: files
    accept: |
      "application/pdf,image/*"
---
id: filing information
question: |
  What you will do with your papers
subquestion: |
  This interview does **not** file your motion. You will need to:

  1. Check and sign the motion and **affidavit**. An affidavit is your statement
     of facts. You sign under the **penalties of perjury**. This means you can
     be punished if you lie.
  2. Send copies to the other parties or their lawyers. Then fill in and sign
     the certificate of service.
  3. File with the **Appeals Court single justice** and send a copy
     to the trial court. Call **617-725-8106** about filing methods if needed.
  4. Pay the **$315 civil filing fee**. Or file a motion to **waive the fee**.
     This means you ask the court not to charge you. You must also file an **affidavit of
     indigency**, which tells the court about your money. You may owe more fees
     to enter the appeal if the judge lets you do so.

  Need a fee waiver? Use the separate
  [Affidavit of Indigency interview](https://apps.suffolklitlab.org/start/indigency/).
  You also need to ask the Appeals Court to waive its entry fee. This interview
  does not make that separate motion. Keep papers about your money out of the copies
  you send to the other side.
  [MassLegalHelp explains how to fill out the affidavit](https://www.masslegalhelp.org/courts-hearings-language-rights/courts-massachusetts/how-fill-out-affidavit-indigency).

  Check the [court's current instructions](https://www.mass.gov/info-details/single-justice-practice)
  before filing. You must wait for a judge to say yes before you can enter the appeal.
continue button field: filing_information
---
id: preview late docketing motion
question: |
  Review your motion and affidavit
subquestion: |
  ${ al_court_bundle.as_pdf(key="final") }

  Check the case details, your reasons, and how you sent copies.
  Your documents have blank lines for you to sign after printing.

  ${ action_button_html(url_action("review_late_docketing_statement"), label="Make changes", color="info") }
continue button field: late_docketing_statement_preview
---
